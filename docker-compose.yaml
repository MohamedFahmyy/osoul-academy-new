   #   volumes:
   #     - ./:/var/www/html
   #   entrypoint: ['php', '/var/www/html/artisan']
   #   depends_on:
   #     mysql:
   #       condition: service_healthy
   #     redis:
   #       condition: service_started

   # npm:
